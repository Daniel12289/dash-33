<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ninja Dash 3D</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Arial Black",Impact,"Helvetica Neue",sans-serif;color:#fff}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  .hidden{display:none !important}
  .ink{text-shadow:2px 0 #5b2d0c,-2px 0 #5b2d0c,0 2px #5b2d0c,0 -2px #5b2d0c,2px 2px #5b2d0c,-2px -2px #5b2d0c,2px -2px #5b2d0c,-2px 2px #5b2d0c}
  .ink-blue{text-shadow:2px 0 #12264a,-2px 0 #12264a,0 2px #12264a,0 -2px #12264a,2px 2px #12264a,-2px -2px #12264a,2px -2px #12264a,-2px 2px #12264a}
  #hud{position:fixed;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;pointer-events:none}
  #hud button{pointer-events:auto}
  #score{font-size:40px;line-height:1}
  #coinsRow{font-size:28px;margin-top:6px;display:flex;align-items:center;gap:8px}
  .starIcon{width:26px;height:26px;background:#ffd23f;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  #dist{font-size:24px;margin-top:6px;color:#dff6ff}
  #hr{display:flex;gap:10px}
  .round{width:52px;height:52px;border-radius:50%;border:4px solid #a5560c;background:linear-gradient(#ffc94a,#f08a12);color:#fff;font-size:20px;font-family:inherit;padding:0;cursor:pointer}
  .btn{border:4px solid #a5560c;border-radius:22px;background:linear-gradient(#ffc94a,#f08a12);color:#fff;font-family:inherit;font-size:34px;padding:14px 46px;cursor:pointer}
  .btn:active,.round:active{transform:translateY(2px)}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
  #menu h1{margin:0;font-size:clamp(56px,16vw,104px);line-height:0.95;color:#a8f22a;text-shadow:3px 0 #2f5a08,-3px 0 #2f5a08,0 3px #2f5a08,0 -3px #2f5a08,3px 3px #2f5a08,-3px -3px #2f5a08,3px -3px #2f5a08,-3px 3px #2f5a08}
  #menu p{margin:6px 0;font-size:18px;color:#fff}
  #menu .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
  .pill{display:inline-block;border:3px solid #8fb2ff;background:#2a3a66;border-radius:14px;padding:12px 14px;font-size:16px;cursor:pointer}
  .pill.ok{background:#2f7d4f}
  .pill.ok::before{content:"\2713  "}
  .small{font-size:15px !important;color:#cfe6ff !important}
  #over .card{background:#efd79b;border:8px solid #c58a4a;border-radius:30px;padding:26px 34px;min-width:270px;color:#fff}
  #over h2{margin:0 0 14px;font-size:46px}
  #over .line{font-size:28px;margin:8px 0;text-align:left}
  #pauseOv{background:rgba(5,8,20,.55)}
  #flash{position:fixed;inset:0;background:#ff3c28;opacity:0;pointer-events:none}
  #err{position:fixed;left:16px;right:16px;top:40%;background:#3a1010;border:3px solid #ff6a5a;border-radius:16px;padding:18px;font-size:16px;text-align:center}

  /* --- loading screen --- */
  #loading{position:fixed;inset:0;z-index:50;background:#0b1440;transition:opacity .5s}
  #loading svg{position:absolute;inset:0;width:100%;height:100%}
  #loading .bar{position:absolute;left:8%;right:8%;bottom:9%;height:46px;border:4px solid #12183a;border-radius:14px;background:#1b2550;overflow:hidden}
  #loading .fill{height:100%;width:0;background:linear-gradient(#ffb64a,#f08a12)}
  #loading .pct{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:26px}
  #loading .tip{position:absolute;left:0;right:0;bottom:calc(9% + 62px);text-align:center;font-size:16px;padding:0 24px}
  #loading .ver{position:absolute;left:14px;bottom:10px;font-size:13px;color:#cfe0ff}
  /* --- home screen --- */
  #menu{padding:0;justify-content:flex-start;align-items:stretch;text-align:left}
  #menu .col{width:100%;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));box-sizing:border-box;pointer-events:none}
  #menu .col > *{pointer-events:auto}
  .topbar{display:flex;align-items:center;gap:8px}
  .chip{display:flex;align-items:center;gap:8px;background:#1c2650;border:3px solid #10163a;border-radius:16px;padding:5px 12px;font-size:20px}
  .grow{flex:1}
  #mainArea{flex:1;min-height:190px;display:flex;justify-content:flex-end;align-items:center;pointer-events:none !important;padding:6px 0}
  #panels{width:52%;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .panel{background:#7f93d8;border:3px solid #4c5ca6;border-radius:16px;padding:8px 10px 10px;box-shadow:0 5px 0 #4c5ca6}
  .panel .t{font-size:19px;text-align:center}
  .panel .v{margin-top:6px;background:#566aa8;border-radius:10px;padding:5px 10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:26px}
  .gold{color:#ffd23f}
  .banner{border-radius:16px;padding:10px 12px;margin-top:8px;border:3px solid rgba(0,0,0,.28)}
  .banner.blue{background:linear-gradient(#d3e5ff,#94bcf5);color:#1c2e5e}
  .how{display:flex;justify-content:space-around;gap:6px}
  .how div{display:flex;flex-direction:column;align-items:center;text-align:center;font-size:12px;line-height:1.2;flex:1}
  .how b{font-size:26px;line-height:1.1}
  .banner.orange{background:linear-gradient(#ffb84f,#f07a12);text-align:center}
  .banner .bt{font-size:22px;margin-bottom:8px}
  .banner .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .banner .pill{font-size:15px;padding:10px 8px;text-align:center}
  .banner .small{margin-top:8px;font-size:13px !important}
  .nav{display:flex;gap:10px;margin-top:10px}
  .navbtn{flex:0 0 20%;height:64px;border-radius:14px;border:4px solid #d9e6ff;background:linear-gradient(#3b8be0,#1f62b3);font-size:28px;cursor:pointer;color:#fff;padding:0}
  .play{flex:1;height:64px;border-radius:14px;border:4px solid #d9ffd0;background:linear-gradient(#78dc52,#3aa61f);font-family:inherit;font-size:40px;color:#fff;cursor:pointer;padding:0}
  .navbtn:active,.play:active{transform:translateY(2px)}
  .btn.green{background:linear-gradient(#78dc52,#3aa61f);border-color:#256c12}
  .btn.blue{background:linear-gradient(#3b8be0,#1f62b3);border-color:#123f7a}
  .btnrow{display:flex;gap:12px;justify-content:center;margin-top:14px}
  #err{z-index:70}
  #loading.hasbg{background-size:cover;background-position:center;background-repeat:no-repeat}
  #loading.hasbg #loadArt{display:none}
  #loading .shade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6));pointer-events:none}
  #loadTitle{position:absolute;left:0;top:0;width:100%;height:100%}
</style>
</head>

</div>

<div id="over" class="screen hidden">

</div>

<script>
/* Loads three.js from libs/ if you put it there, otherwise from a CDN. Also drives the loading bar. */
(function () {
  var LOAD = window.__LOAD = { done: 0, total: 7, target: 0, shown: 0, finished: false, fatal: false, t0: Date.now() };
  LOAD.tick = function () { if (LOAD.finished) return; LOAD.done++; LOAD.target = Math.min(1, LOAD.done / LOAD.total); };
  var tips = ['Swipe down to slide under the gates.', 'Coins in the air are worth the jump.', 'Trains are tall: change lanes to get past them.', 'The longer you run, the faster it gets.'];
  document.getElementById('tip').textContent = 'Tip: ' + tips[Math.floor(Math.random() * tips.length)];
  var L = (window.NINJA_CONFIG && window.NINJA_CONFIG.loading) || {};
  var bgList = ['assets/loading.jpg', 'assets/loading.jpeg', 'assets/loading.png', 'assets/loading.webp'];
  if (L.file) bgList.unshift(L.file);
  var loadBox = document.getElementById('loading');
  function tryBg(i) {
    if (i >= bgList.length) return;
    var im = new Image();
    im.onload = function () {
      loadBox.style.backgroundImage = 'url("' + bgList[i] + '")';
      loadBox.classList.add('hasbg');
      if (!L.showTitle) document.getElementById('loadTitle').style.display = 'none';
    };
    im.onerror = function () { tryBg(i + 1); };
    im.src = bgList[i];
  }
  tryBg(0);
  var fill = document.getElementById('loadFill'), pct = document.getElementById('loadPct'), box = document.getElementById('loading');
  function frame() {
    LOAD.shown = Math.min(LOAD.target, LOAD.shown + Math.max(0.004, (LOAD.target - LOAD.shown) * 0.12));
    fill.style.width = (LOAD.shown * 100) + '%';
    pct.textContent = Math.round(LOAD.shown * 100) + '%';
    if (LOAD.fatal || (LOAD.done >= LOAD.total && LOAD.shown >= 0.999 && Date.now() - LOAD.t0 > 1500)) {
      LOAD.finished = true;
      box.style.opacity = '0';
      setTimeout(function () { box.style.display = 'none'; }, 550);
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(function () { LOAD.done = LOAD.total; LOAD.target = 1; }, 20000);   // never get stuck

  var libs = [
    ['libs/three.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'],
    ['libs/GLTFLoader.js', 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js']
  ];
  function add(src, ok, fail) {
    var s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  }
  function step(i) {
    if (i >= libs.length) { window.__startNinja(); return; }
    add(libs[i][0], function () { LOAD.tick(); step(i + 1); }, function () {
      add(libs[i][1], function () { LOAD.tick(); step(i + 1); }, function () {
        if (i === 0) {
          LOAD.fatal = true;
          var e = document.getElementById('err');
          e.textContent = 'Could not load three.js. Connect to the internet, or put three.min.js in the libs folder.';
          e.classList.remove('hidden');
        } else { LOAD.tick(); step(i + 1); }     // model loader is optional: the built-in models still work
      });
    });
  }
  window.addEventListener('load', function () { step(0); });
})();
</script>

<script>
window.__startNinja = function () {
'use strict';
const THREE = window.THREE;
const rnd = (a, b) => a + Math.random() * (b - a);
const rndInt = (a, b) => Math.floor(rnd(a, b + 1));
const rad = d => d * Math.PI / 180;
const $ = id => document.getElementById(id);
const tick = () => { if (window.__LOAD) window.__LOAD.tick(); };
const fmt = n => Number(n || 0).toLocaleString('en-US');
const SAVE_KEY = 'ninjadash3d';
let SAVE = { coins: 0, best: 0 };
try { const raw = localStorage.getItem(SAVE_KEY); if (raw) SAVE = Object.assign(SAVE, JSON.parse(raw)); } catch (e) {}
function saveData() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }

/* ---------------- Settings (see config.js) ---------------- */
const DEFAULTS = {
  player: { file: 'assets/player.glb', height: 1.8, rotateX: 0, rotateY: 180, rotateZ: 0, runSpeed: 1,
            animations: { run: '', jump: '', slide: '', dead: '', idle: '' } },
  coin:   { file: 'assets/coin.glb', size: 0.8, rotateX: 0, rotateY: 0, rotateZ: 0, spin: true, spinSpeed: 2.5 },
  house:  { file: 'assets/house.png', width: 9 },
  train:  { file: 'assets/train.glb', length: 6, maxWidth: 2.0, rotateX: 0, rotateY: 0, rotateZ: 0 },
  audio:  { file: 'assets/sound.mp3', volume: 0.6, loop: true, enabled: true, sfx: true },
  camera: { angle: 45, minHeight: 11, targetZ: -5.5 },
  plant:  { file: 'assets/plant.glb', height: 1.4, rotateX: 0, rotateY: 0, rotateZ: 0,
            min: 1, max: 3, distance: 4.5, enabled: true }
};
const USER = window.NINJA_CONFIG || {};
const CFG = {};
for (const k of Object.keys(DEFAULTS)) CFG[k] = Object.assign({}, DEFAULTS[k], USER[k] || {});
CFG.player.animations = Object.assign({}, DEFAULTS.player.animations, (USER.player && USER.player.animations) || {});

/* ---------------- Audio (synthesized) ---------------- */
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  musicPlay();
}
const MUSIC = { el: null, failed: false };
function musicPlay() {
  if (!CFG.audio.enabled || MUSIC.failed || muted) return;
  if (!MUSIC.el) {
    const a = new Audio(CFG.audio.file);

  g.gain.setValueAtTime(vol, t);

  if (dim > 0) model.scale.multiplyScalar(target / dim);
  box.setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x; model.position.z -= c.z;

  const wrap = new THREE.Group();
  wrap.add(model);

}

  box.setFromObject(model);
  size = box.getSize(new THREE.Vector3());
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x; model.position.z -= c.z; model.position.y -= box.min.y;

/* ---------------- Update ---------------- */
function moveWorld(dz) {
  for (const o of G.obs) { o.z -= dz; o.mesh.position.z = -(o.z + o.d / 2); }
  for (const c of G.coinsArr) c.z -= dz;
  G.nextRowZ -= dz;
  roadTex.offset.y += dz / TILE;
  for (const h of houses) {
    h.z -= dz;
    if (h.z + h.depth < -18) {
      let end = -1e9;
      for (const k of houses) if (k.side === h.side && k !== h) end = Math.max(end, k.z + k.depth);
      h.z = end + rnd(0.5, 3);
    }
    placeHouse(h);
  }
  G.obs = G.obs.filter(o => { if (o.z + o.d < -14) { scene.remove(o.mesh); return false; } return true; });
  G.coinsArr = G.coinsArr.filter(c => { if (c.z < -14 || c.got) { scene.remove(c.mesh); return false; } return true; });
}

function update(dt) {
  G.t += dt;
  if (!G.dead) { G.speed = Math.min(30, 14 + G.t * 0.19); G.dist += G.speed * dt; }
  else G.speed = Math.max(0, G.speed - 70 * dt);
  moveWorld(G.speed * dt);
  while (G.nextRowZ < 110) spawnRow();

  const tx = P.lane * LANE, dx = tx - P.x;
  P.x += Math.sign(dx) * Math.min(Math.abs(dx), 21 * dt);
  P.vy -= 32 * dt;
  P.y += P.vy * dt;
  if (P.y < 0) { P.y = 0; P.vy = 0; }
  if (P.slide > 0) P.slide -= dt;
  P.anim += dt * (8 + G.speed * 0.5);
  if (G.dead) P.rot += dt * 9;

  if (!G.dead) {
    const h = P.slide > 0 ? 0.9 : 1.8;
    const x0 = P.x - 0.35, x1 = P.x + 0.35, y0 = P.y, y1 = P.y + h;
    for (const o of G.obs) {
      if (o.z > 2 || o.z + o.d < -2) continue;
      const lx = o.lane * LANE;
      const hw = o.hw, oy0 = o.y0, oy1 = o.top;
      if (x1 > lx - hw && x0 < lx + hw && y1 > oy0 && y0 < oy1 && o.z < 0.45 && o.z + o.d > -0.45) { crash(); break; }
    }
    for (const c of G.coinsArr) {
      if (!c.got && Math.abs(c.z) < 1.0 && Math.abs(c.lane * LANE - P.x) < 1.0 && c.y > y0 - 0.3 && c.y < y1 + 0.3) {
        c.got = true; G.coins++; sfx.coin();
      }
    }
  }
  G.score = Math.floor(G.dist) + G.coins * 10;
  $('score').textContent = G.score;
  $('coinsN').textContent = G.coins;
  $('dist').textContent = Math.floor(G.dist) + ' m';
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 1.6);
  const fl = parseFloat($('flash').style.opacity) || 0;
  if (fl > 0) $('flash').style.opacity = String(Math.max(0, fl - dt * 1.1));
  if (G.dead) { G.deadT += dt; if (G.deadT > 1.0) endGame(); }
}

/* ---------------- Visuals per frame ---------------- */
function updateVisuals(dt, inMenu) {
  const tx = P.lane * LANE;
  playerHolder.position.set(P.x, P.y, 0);
  playerHolder.rotation.z = G.dead ? P.rot : (P.x - tx) * 0.15;
  const air = P.y > 0.02, sliding = P.slide > 0 && !G.dead;
  shadowBlob.position.x = P.x;
  const sh = Math.max(0.3, 1 - P.y / 3);
  shadowBlob.scale.set(sh, sh, sh);
  shadowBlob.material.opacity = 0.35 * sh;

  if (rig) {
    const r = rig, s = Math.sin(P.anim);
    if (inMenu) { r.legL.rotation.x = 0; r.legR.rotation.x = 0; r.armL.rotation.x = Math.sin(clock * 1.6) * 0.1; r.armR.rotation.x = -Math.sin(clock * 1.6) * 0.1; }
    else if (air) { r.legL.rotation.x = 0.9; r.legR.rotation.x = -0.5; r.armL.rotation.x = 2.6; r.armR.rotation.x = 2.6; }
    else { r.legL.rotation.x = s; r.legR.rotation.x = -s; r.armL.rotation.x = -s * 0.9; r.armR.rotation.x = s * 0.9; }
    r.body.position.y = air ? 0 : Math.abs(Math.cos(P.anim)) * 0.06;
    r.tails.forEach((t, i) => { t.rotation.x = -0.15 + Math.sin(P.anim * 0.9 + i * 1.7) * 0.3 + (air ? -0.25 : 0); });
    const base = CFG.player.height / 1.96;
    r.root.scale.set(base * (sliding ? 1.15 : 1), base * (sliding ? 0.55 : 1), base);
  } else if (playerKind === 'model') {
    if (mixer) {
      if (inMenu) { if (acts && acts.idle) playAnim('idle'); else { playAnim('run'); if (acts && acts.run) acts.run.paused = true; } }
      else { if (acts && acts.run) acts.run.paused = false; playAnim(G.dead ? 'dead' : air ? 'jump' : sliding ? 'slide' : 'run'); }
      if (acts && acts.run) acts.run.timeScale = Math.min(2, Math.max(0.8, G.speed / 14)) * CFG.player.runSpeed;
      mixer.update(dt);
    } else {
      // no animation clips in the model: add a little bounce so it does not glide
      const wrap = playerHolder.children[0];
      if (wrap) {
        wrap.position.y = air ? 0 : Math.abs(Math.cos(P.anim)) * 0.06;
        wrap.scale.set(sliding ? 1.15 : 1, sliding ? 0.55 : 1, 1);
      }
    }
  }

  for (const c of G.coinsArr) {
    c.mesh.position.set(c.lane * LANE, c.y + Math.sin(clock * 5 + c.ph) * 0.08, -c.z);
    if (CFG.coin.spin) c.mesh.rotation.y = clock * CFG.coin.spinSpeed + c.ph;
  }

  camX += (P.x * 0.55 - camX) * Math.min(1, dt * 8);
  const k = camT * camT * (3 - 2 * camT);                       // 0 = home screen, 1 = running
  playerHolder.rotation.y = (1 - k) * (Math.PI + Math.sin(clock * 0.6) * 0.3);
  const shk = G.shake > 0 ? G.shake * 0.35 : 0;
  const gx = camX + (shk ? rnd(-1, 1) * shk : 0), gy = camY + (shk ? rnd(-1, 1) * shk : 0);
  if (k < 0.999) {
    const m = computeMenuCam();
    camera.position.set(m.x + (gx - m.x) * k, m.y + (gy - m.y) * k, m.z + (camDist - m.z) * k);
    camera.lookAt(m.lx + (camX - m.lx) * k, m.ly + (0.5 - m.ly) * k, CFG.camera.targetZ * k);
  } else {
    camera.position.set(gx, gy, camDist);
    camera.lookAt(camX, 0.5, CFG.camera.targetZ);
  }
}
// camera for the home screen: the runner fills the space on the left of the panels
function computeMenuCam() {
  const area = $('mainArea').getBoundingClientRect(), sw = window.innerWidth, sh = window.innerHeight;
  const colW = Math.min(sw, 520), colLeft = (sw - colW) / 2;
  const frac = Math.max(0.3, Math.min(0.95, area.height * 0.9 / sh));
  const visH = 1.9 / frac;
  const dist = (visH / 2) / Math.tan(rad(30));
  const halfW = (visH / 2) * camera.aspect;
  const fx = (colLeft + colW * 0.24) / sw;
  const cy = (area.top + area.height / 2) / sh;
  const lx = (0.5 - fx) * 2 * halfW, ly = 0.9 + (cy - 0.5) * visH;
  return { x: lx, y: ly, z: dist, lx: lx, ly: ly };
}

/* ---------------- Input ---------------- */
let drag = null;
function onUI(e) { return e.target && e.target.closest && e.target.closest('button,label,input'); }
window.addEventListener('pointerdown', e => {
  initAudio();
  if (onUI(e)) return;
  if (state === 'play') {
    if (paused) { setPaused(false); return; }
    drag = { x: e.clientX, y: e.clientY, fired: false };
  }
});
window.addEventListener('pointermove', e => {
  if (!drag || drag.fired || state !== 'play' || paused) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
  drag.fired = true;
  if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
  else if (dy < 0) jump(); else doSlide();
});
window.addEventListener('pointerup', () => {
  if (drag && !drag.fired && state === 'play' && !paused) jump();     // a plain tap jumps
  drag = null;
});
window.addEventListener('pointercancel', () => { drag = null; });

function setPaused(p) {
  if (state !== 'play') return;
  paused = p; show('pauseOv', p);
  if (MUSIC.el) { if (p) MUSIC.el.pause(); else musicPlay(); }
  $('btnPause').innerHTML = p ? '&#9654;' : '&#10074;&#10074;';
}
function setMuted(m) { muted = m; if (MUSIC.el) MUSIC.el.muted = m; if (!m) musicPlay(); $('btnSound').innerHTML = m ? '&#215;' : '&#9835;'; $('btnGear').innerHTML = m ? '&#128263;' : '&#9881;'; }
$('btnPlay').addEventListener('click', () => { initAudio(); startGame(); });
$('btnRestart').addEventListener('click', () => { if (overT > 0.3) startGame(); });
$('btnPause').addEventListener('click', () => { initAudio(); setPaused(!paused); sfx.click(); });
$('btnSound').addEventListener('click', () => { initAudio(); setMuted(!muted); sfx.click(); });
$('btnGear').addEventListener('click', () => { initAudio(); setMuted(!muted); sfx.click(); });
$('btnHome').addEventListener('click', () => { initAudio(); sfx.click(); });
$('btnCustom').addEventListener('click', () => { initAudio(); const c = $('custom'); c.classList.toggle('hidden'); sfx.click(); });
$('btnOverHome').addEventListener('click', () => { initAudio(); if (overT > 0.3) goToMenu(); });
window.addEventListener('keydown', e => {
  initAudio();
  const k = e.code, up = k === 'ArrowUp' || k === 'KeyW' || k === 'Space';
  if (up || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'KeyA' || k === 'KeyD' || k === 'KeyS') e.preventDefault();
  if (e.repeat) return;
  if (state === 'menu') { if (up || k === 'Enter') startGame(); return; }
  if (state === 'over') { if ((up || k === 'Enter') && overT > 0.4) startGame(); return; }
  if (k === 'KeyP' || k === 'Escape') { setPaused(!paused); return; }
  if (k === 'KeyM') { setMuted(!muted); return; }
  if (paused) { if (up || k === 'Enter') setPaused(false); return; }
  if (up) jump();
  else if (k === 'ArrowDown' || k === 'KeyS') doSlide();
  else if (k === 'ArrowLeft' || k === 'KeyA') moveLane(-1);
  else if (k === 'ArrowRight' || k === 'KeyD') moveLane(1);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (MUSIC.el) MUSIC.el.pause(); if (state === 'play') setPaused(true); }
  else if (state !== 'play') musicPlay();
});

/* ---------------- Main loop ---------------- */
newWorld();
buildHouses();
refreshMenu();
loadModel('player', CFG.player.file, true);
loadModel('coin', CFG.coin.file, true);
loadModel('train', CFG.train.file, true);
loadModel('plant', CFG.plant.file, true);
loadHouseImage(CFG.house.file, true);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; clock += dt;
  camT = Math.max(0, Math.min(1, camT + (state === 'menu' ? -1 : 1) * dt * 2.2));
  if (state === 'play') { if (!paused) update(dt); }
  else if (state === 'menu') { P.anim += dt * 2; }
  else if (state === 'over') { overT += dt; }
  updateVisuals(paused ? 0 : dt, state === 'menu');
  try { renderer.render(scene, camera); }
  catch (err) {
    // a picture the browser refuses to use as a texture (happens when opened as a plain file)
    if (houseTex) { houseTex = null; buildHouses(); }
  }
}
requestAnimationFrame(frame);
if (location.protocol === 'file:') {
  const e = $('err');
  e.textContent = 'Opened as a plain file, so files in the assets folder cannot load. Run run.bat (Windows) or run.sh (Mac/Linux), or use the buttons below to pick your files.';
  e.classList.remove('hidden');
  setTimeout(() => e.classList.add('hidden'), 9000);
}
};
</script>
